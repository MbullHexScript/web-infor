server {
    listen 80;
    listen [::]:80;
    server_name informatika.uinbanten.ac.id;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name informatika.uinbanten.ac.id;

    root /var/www/informatika/current/public;
    index index.php index.html;

    client_max_body_size 25m;

    access_log /var/log/nginx/informatika.access.log;
    error_log /var/log/nginx/informatika.error.log warn;

    ssl_certificate /etc/ssl/informatika/origin.pem;
    ssl_certificate_key /etc/ssl/informatika/origin.key;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /health {
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~* \.(?:css|js|mjs|woff2?|ttf|eot|png|jpg|jpeg|gif|webp|avif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ ^/(?:\.env|composer\.(?:json|lock)|package(?:-lock)?\.json|artisan|phpunit\.xml) {
        deny all;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* ^/(?:storage/private|storage/app|backups|vendor|node_modules)/ {
        deny all;
    }

    location ~* ^/storage/.*\.php$ {
        deny all;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }
}
